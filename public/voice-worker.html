<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ThinkDrop Voice Worker</title>
<style>
  /* Invisible worker page — the window is 1x1 offscreen. This UI only shows
     if someone opens /voice/worker manually (debug). */
  body { margin:0; background:#0a0a0f; color:#888; font:12px/1.4 -apple-system,monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
  #state { font-size:14px; color:#ccc; margin-bottom:8px; }
  #log { max-height:60vh; overflow-y:auto; width:90%; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="state">connecting…</div>
<div id="log"></div>
<script>
'use strict';
/**
 * ThinkDrop voice worker — runs inside a hidden real-Chrome window launched
 * by companion-driver.cjs (Playwright channel:'chrome', 1x1 offscreen).
 *
 * Responsibilities:
 *   - webkitSpeechRecognition → stream {interim,final,state,error} over WS
 *   - Receive {audio-begin, <binary frames>, audio-end} → decode + play TTS
 *   - Receive {speak} → speechSynthesis fallback
 *   - Echo guard: abort() (not stop()) before playback, results gated while
 *     speaking + a short post-playback window, delayed restart — stops the
 *     mic hearing our own TTS and re-submitting it as user speech.
 *   - Optional mic level meter (?level=0 disables) for overlay voice bars
 *   - ?duplex=1: while speaking, interims are forwarded tagged
 *     {duringSpeech:true} for server-side barge-in decisions.
 *
 * The page has NO user gesture — audio autoplay relies on
 * --autoplay-policy=no-user-gesture-required (set by the driver).
 */

const params = new URLSearchParams(location.search);
const WS_URL = params.get('ws') || `ws://${location.host}/voice.ws`;
const LANG = params.get('lang') || navigator.language || 'en-US';
const LEVEL_METER = params.get('level') !== '0';
const DUPLEX = params.get('duplex') !== '0'; // barge-in on by default (?duplex=0 opts out)
const SINK = params.get('sink') || ''; // 'auto-headphones' or an audiooutput deviceId
const MIC_PIN = params.get('mic') || ''; // label substring pins the realtime mic

const stateEl = document.getElementById('state');
const logEl = document.getElementById('log');
function log(msg) {
  const line = document.createElement('div');
  line.textContent = `[${new Date().toISOString().slice(11, 23)}] ${msg}`;
  logEl.prepend(line);
  while (logEl.children.length > 120) logEl.lastChild.remove();
}

// ---------------------------------------------------------------- WS client
let ws = null;
let wsReady = false;
let sessionActive = false;   // server sets via {type:'session', active}
let reconnectDelay = 500;

function send(obj) {
  if (wsReady) { try { ws.send(JSON.stringify(obj)); } catch (_) {} }
}
function setState(state) {
  stateEl.textContent = state;
  send({ type: 'state', state });
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    wsReady = true;
    reconnectDelay = 500;
    log('ws connected');
    send({ type: 'ready', lang: LANG, ua: navigator.userAgent });
    if (sessionActive) startListening();
  };
  ws.onclose = () => {
    wsReady = false;
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 5000);
  };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      let msg; try { msg = JSON.parse(ev.data); } catch (_) { return; }
      handleCommand(msg);
    } else {
      pendingAudio.push(ev.data); // binary TTS frame
    }
  };
}

// ------------------------------------------------------------- commands
function handleCommand(msg) {
  switch (msg.type) {
    case 'session':
      sessionActive = !!msg.active;
      log(`session ${sessionActive ? 'start' : 'stop'}`);
      pttActive = false; // a full session supersedes any parked-PTT state
      if (sessionActive) startListening(); else stopListening();
      break;
    case 'ptt': // ROpt-hold push-to-talk — single-shot SR, no session/LLM/TTS
      if (msg.active) {
        if (rtActive) { send({ type: 'error', error: 'ptt-blocked', detail: 'realtime-active' }); break; }
        pttActive = true;
        startLevelMeter();
        try { recognition.start(); } catch (_) {}
      } else if (msg.discard) {
        pttActive = false;
        try { recognition.abort(); } catch (_) {}
        if (!wantListening) setState('idle');
      } else {
        // stop() (not abort) lets the in-flight final drain — pttActive stays
        // set until onend so the drained result still lands on the ptt lane.
        try { recognition.stop(); } catch (_) {}
        if (!wantListening) setState('idle');
      }
      break;
    case 'ptt-warm': // prime mic permission + the SR connection at warm-start
      primingSR = true;
      try { recognition.start(); } catch (_) { primingSR = false; }
      setTimeout(() => { try { recognition.abort(); } catch (_) {} primingSR = false; }, 800);
      break;
    case 'audio-begin':
      // Gate recognition BEFORE the first audio byte is even decoded —
      // TTS starts reaching the mic only after this, so any result that
      // races in from now on is suspect.
      pendingAudio = [];
      audioFormat = msg.format || 'wav';
      stopAudio();
      speaking = true;
      suppressUntil = Date.now() + 30000; // generous bound; tightened on play end
      try { recognition && recognition.abort(); } catch (_) {}
      break;
    case 'audio-end':
      playBufferedAudio();
      break;
    case 'speak': // speechSynthesis fallback
      speakFallback(msg.text, msg.lang);
      break;
    case 'filler-play': // pre-generated filler clip — same gated playback path
      playFiller(msg.src);
      break;
    case 'filler-preload': // warm the decode cache (session start / regen)
      preloadFillers(msg.urls || []);
      break;
    case 'stop': // barge-in / abort playback
      interruptPlayback();
      break;
    case 'mute': // ROpt-tap mute — park SR (pipeline) or kill the mic track (S2S)
      muted = !!msg.active;
      if (muted) {
        try { recognition.abort(); } catch (_) {}
        if (rtMic) rtMic.getTracks().forEach(t => { t.enabled = false; });
        setState('muted');
      } else {
        if (rtMic) rtMic.getTracks().forEach(t => { t.enabled = true; });
        if (wantListening && !rtActive) startListening();
        else setState(rtActive ? 'talking' : 'idle');
      }
      break;
    case 'sleep': // server-level sleep state — SR stays alive, server drops non-wake finals
      setState(msg.active ? 'sleeping' : (wantListening ? 'listening' : 'idle'));
      break;
    case 'realtime': // S2S Talk Mode: {active:true} start, {active:false} stop
      if (msg.active) startRealtime().catch(e => {
        log(`realtime start failed: ${e.message}`);
        stopRealtime(); // restores SR if wantListening — pipeline takes over
        send({type:'error', error:'realtime-start-failed', detail: String(e.message || e)});
      });
      else stopRealtime();
      break;
    case 'rt-tool-result': // server resolved a function call → feed back to model
      rtToolResult(msg.call_id, msg.output);
      break;
    case 'rt-cancel': // server-side control intercept — stop the in-flight response
      if (rtDc && rtDc.readyState === 'open') rtDc.send(JSON.stringify({ type: 'response.cancel' }));
      break;
    case 'rt-inject': // server-side context/thought/task-result → model speaks it
      rtInject(msg.text);
      break;
    case 'rt-context': // silent live-context refresh — context item, no response
      rtContextUpdate(msg.text);
      break;
    case 'ambient-start': // audio journal — system-audio capture
      ambientStart(msg.engine).catch(e => {
        log(`ambient start failed: ${e.message}`);
        send({ type: 'error', error: 'ambient-start-failed', detail: String(e.message || e) });
      });
      break;
    case 'ambient-stop':
      ambientStop();
      break;
    case 'ping':
      send({ type: 'pong' });
      break;
  }
}

// ------------------------------------------------- SpeechRecognition (STT)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let wantListening = false;
let speaking = false;
let suppressUntil = 0;        // results are dropped while speaking or before this ts
let restartTimer = null;
const RESTART_DELAY_MS = 500; // let speaker ring / room reverb die before re-arming
let currentLang = LANG;
let rtActive = false;         // realtime owns the mic — SR stays parked
let pttActive = false;        // ROpt-hold PTT — finals go to the ptt-final lane
let primingSR = false;        // warm-start SR prime — suppress state/results
let muted = false;            // ROpt-tap mute — SR parked / realtime track dead

function suppressed() { return speaking || Date.now() < suppressUntil; }

function scheduleRestart() {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if (wantListening && !speaking && !rtActive) {
      try { recognition.start(); } catch (_) {}
    }
  }, RESTART_DELAY_MS);
}

if (SR) {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = LANG;

  recognition.onresult = (ev) => {
    if ((!wantListening && !pttActive) || rtActive || muted) return; // drain after stop, realtime owns the mic, or muted — discard
    const isSuppressed = suppressed();
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      const text = res[0].transcript;
      if (res.isFinal) {
        if (isSuppressed) { log(`dropped final (suppressed): ${text}`); continue; }
        const lang = detectScriptLang(text) || currentLang;
        log(`final: ${text}`);
        send(pttActive ? { type: 'ptt-final', text: text.trim(), lang } : { type: 'final', text: text.trim(), lang });
      } else {
        interim += text;
      }
    }
    if (interim) {
      if (isSuppressed) {
        // Duplex mode: forward tagged interims so the server can decide
        // barge-in vs. our own TTS echo — never auto-interrupt client-side.
        if (DUPLEX && !pttActive) send({ type: 'interim', text: interim.trim(), lang: currentLang, duringSpeech: true });
      } else {
        send(pttActive ? { type: 'ptt-interim', text: interim.trim() } : { type: 'interim', text: interim.trim(), lang: currentLang });
      }
    }
  };
  recognition.onerror = (ev) => {
    log(`sr error: ${ev.error}`);
    if (pttActive) { send({ type: 'ptt-error', error: ev.error }); return; }
    send({ type: 'error', error: ev.error });
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      wantListening = false;
      setState('error');
    }
  };
  recognition.onend = () => {
    pttActive = false; // stop() drained — clear the PTT lane
    if (muted) { setState('muted'); return; } // stay parked while muted
    // Chrome stops recognition on silence — keep it alive while wanted.
    if (!wantListening) { setState('idle'); return; }
    if (rtActive) return;              // realtime owns the mic — stay parked
    if (speaking) return;              // restarted at speak end
    if (Date.now() < suppressUntil) { scheduleRestart(); return; }
    try { recognition.start(); } catch (_) {}
  };
  recognition.onstart = () => { if (!rtActive && !primingSR) setState('listening'); };
  // Pause / speech-boundary signals — the server's filler policy uses these
  // for backchannel placement (transition-relevance places) and aggregation.
  recognition.onspeechstart = () => { if (!rtActive && !pttActive) send({ type: 'speech-event', event: 'speech-start' }); };
  recognition.onspeechend   = () => { if (!rtActive && !pttActive) send({ type: 'speech-event', event: 'speech-end' }); };
  recognition.onsoundstart  = () => { if (!rtActive && !pttActive) send({ type: 'speech-event', event: 'sound-start' }); };
  recognition.onsoundend    = () => { if (!rtActive && !pttActive) send({ type: 'speech-event', event: 'sound-end' }); };
} else {
  send({ type: 'error', error: 'speech-recognition-unsupported' });
  stateEl.textContent = 'SpeechRecognition unsupported';
}

function startListening() {
  if (!recognition) return;
  wantListening = true;
  if (!suppressed() && !rtActive && !muted) {
    try { recognition.start(); } catch (_) {}
  }
  startLevelMeter();
}

function stopListening() {
  wantListening = false;
  stopAudio();
  speaking = false;
  suppressUntil = 0;
  clearTimeout(restartTimer);
  // abort (not stop) — we don't want drain results submitted post-session.
  try { recognition && recognition.abort(); } catch (_) {}
  setState('idle');
}

// crude script→lang heuristic (kept from VoiceCompanion)
function detectScriptLang(text) {
  if (/[぀-ヿ]/.test(text)) return 'ja';
  if (/[가-힯]/.test(text)) return 'ko';
  if (/[一-鿿]/.test(text)) return 'zh';
  if (/[؀-ۿ]/.test(text)) return 'ar';
  if (/[а-яё]/i.test(text)) return 'ru';
  return null;
}

// -------------------------------------------------------------- TTS playback
let audioCtx = null;
let pendingAudio = [];
let audioFormat = 'wav';
let currentSource = null;

let sinkTried = false;

function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (!sinkTried) { sinkTried = true; applyOutputSink(); }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

/**
 * Route TTS playback to a chosen output — 'auto-headphones' picks the first
 * audiooutput device whose label looks like headphones/earbuds. With TTS in
 * headphones the mic physically can't hear it (no echo to fight).
 */
async function applyOutputSink() {
  if (!SINK || typeof audioCtx.setSinkId !== 'function') return;
  try {
    let id = SINK;
    if (SINK === 'auto-headphones') {
      const devs = await navigator.mediaDevices.enumerateDevices();
      const hp = devs.find(d => d.kind === 'audiooutput' && /headphone|airpod|earbud|headset/i.test(d.label || ''));
      if (!hp) { log('no headphone output found — keeping default sink'); return; }
      id = hp.deviceId;
    }
    await audioCtx.setSinkId(id);
    log(`tts output sink: ${id}`);
  } catch (e) {
    log(`setSinkId failed: ${e.message}`);
  }
}

async function playBufferedAudio() {
  if (!pendingAudio.length) { releaseSpeechGate(); return; }
  const blob = new Blob(pendingAudio, { type: `audio/${audioFormat}` });
  pendingAudio = [];
  try {
    const buf = await getCtx().decodeAudioData(await blob.arrayBuffer());
    playBuffer(buf);
  } catch (e) {
    log(`decode failed: ${e.message}`);
    releaseSpeechGate();
    send({ type: 'error', error: 'tts-decode-failed' });
  }
}

/** End the speaking state: brief guard window, then re-arm recognition. */
function endSpeaking() {
  speaking = false;
  suppressUntil = Date.now() + RESTART_DELAY_MS;
  setState(wantListening ? 'listening' : 'idle');
  send({ type: 'speak-done' });
  scheduleRestart();
}

/** Release the gate when audio never played (empty/decode-failed stream). */
function releaseSpeechGate() {
  if (!speaking) return;
  speaking = false;
  suppressUntil = Date.now() + RESTART_DELAY_MS;
  scheduleRestart();
}

function playBuffer(buf) {
  // speaking was already set at audio-begin; reaffirm for safety.
  speaking = true;
  suppressUntil = Date.now() + 30000;
  try { recognition && recognition.abort(); } catch (_) {}
  setState('speaking');
  const src = getCtx().createBufferSource();
  src.buffer = buf;
  src.connect(getCtx().destination);
  currentSource = src;
  src.onended = () => {
    if (currentSource === src) {
      currentSource = null;
      endSpeaking();
    }
  };
  src.start();
}

function speakFallback(text, lang) {
  if (!text) return;
  stopAudio();
  speaking = true;
  suppressUntil = Date.now() + 30000;
  try { recognition && recognition.abort(); } catch (_) {}
  setState('speaking');
  const u = new SpeechSynthesisUtterance(text);
  if (lang) u.lang = lang;
  u.onend = u.onerror = () => endSpeaking();
  speechSynthesis.speak(u);
}

// ----------------------------------------------------------- filler playback
// Pre-generated, voice-matched clips served by the voice-service over HTTP.
// Decoded once into AudioBuffers and cached — replay latency is ~10ms, which
// is what makes sub-250ms conversational timing possible (live TTS can't).
const fillerBuffers = new Map(); // src -> AudioBuffer | Promise<AudioBuffer>

async function decodeFiller(src) {
  let entry = fillerBuffers.get(src);
  if (!entry) {
    entry = (async () => {
      const res = await fetch(src);
      if (!res.ok) throw new Error(`filler fetch ${res.status}`);
      return getCtx().decodeAudioData(await res.arrayBuffer());
    })();
    fillerBuffers.set(src, entry);
    entry.catch(() => fillerBuffers.delete(src)); // don't cache failures
  }
  return entry;
}

async function playFiller(src) {
  if (!src) return;
  try {
    // Gate BEFORE awaiting decode — sound starts as soon as the buffer is ready.
    stopAudio();
    speaking = true;
    suppressUntil = Date.now() + 30000;
    try { recognition && recognition.abort(); } catch (_) {}
    const buf = await decodeFiller(src);
    if (!speaking) return; // interrupted while decoding
    playBuffer(buf);
  } catch (e) {
    log(`filler failed: ${e.message}`);
    releaseSpeechGate();
  }
}

function preloadFillers(urls) {
  for (const src of urls.slice(0, 250)) decodeFiller(src).catch(() => {});
}

/** Halt any in-flight audio without touching the speaking gate. */
function stopAudio() {
  if (currentSource) { try { currentSource.onended = null; currentSource.stop(); } catch (_) {} currentSource = null; }
  try { speechSynthesis.cancel(); } catch (_) {}
  pendingAudio = [];
}

/** Barge-in / server stop: halt audio, release the gate, re-arm listening. */
function interruptPlayback() {
  stopAudio();
  if (speaking) {
    speaking = false;
    suppressUntil = Date.now() + RESTART_DELAY_MS;
    send({ type: 'interrupted' });
    setState(wantListening ? 'listening' : 'idle');
    scheduleRestart();
  }
}

// --------------------------------------------------------- realtime S2S mode
// OpenAI Realtime over WebRTC, hosted in the page: mic + remote audio ride RTC
// tracks, so Chrome's WebRTC AEC natively cancels the model's voice from the
// mic — no manual gating needed. SR is paused; the model does its own VAD/STT.
// Events flow over the 'oai-events' data channel → relayed over /voice.ws.
let rtPc = null;
let rtDc = null;
let rtMic = null;
let rtAudioEl = null;
let rtAssistantBuf = '';
// Outbound messages are queued until the SCTP channel actually opens — ICE
// 'connecting'/post-answer is NOT usable, and plain drops here lost context
// updates + tool results that landed mid-handshake.
let rtOutbox = [];

function rtSend(obj) {
  if (rtDc && rtDc.readyState === 'open') {
    try { rtDc.send(JSON.stringify(obj)); } catch (_) {}
  } else if (rtDc) {
    if (rtOutbox.length >= 20) rtOutbox.shift();
    rtOutbox.push(obj);
  }
}

function flushRtOutbox() {
  if (!rtDc || rtDc.readyState !== 'open') return;
  for (const m of rtOutbox) { try { rtDc.send(JSON.stringify(m)); } catch (_) {} }
  rtOutbox = [];
}

/** Resolve once ICE gathering completes (no trickle — candidates must be in
 * the SDP), with a timeout so slow networks don't stall forever. */
function waitForIceGathering(pc, timeoutMs) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const timer = setTimeout(done, timeoutMs || 1500);
    function done() {
      clearTimeout(timer);
      pc.removeEventListener('icegatheringstatechange', onChange);
      resolve();
    }
    function onChange() { if (pc.iceGatheringState === 'complete') done(); }
    pc.addEventListener('icegatheringstatechange', onChange);
  });
}

let rtStarting = false;
async function startRealtime() {
  if (rtStarting || rtPc) { log('realtime already starting/started — ignored'); return; }
  rtStarting = true;
  try { return await _startRealtimeInner(); } finally { rtStarting = false; }
}
async function _startRealtimeInner() {
  stopRealtime(false); // tear down any prior PC without reviving SR
  rtActive = true;     // park SR for the duration of the call
  try { recognition && recognition.abort(); } catch (_) {} // free the mic now, not post-connect
  rtPc = new RTCPeerConnection();
  rtDc = rtPc.createDataChannel('oai-events');
  rtDc.onopen = () => {
    flushRtOutbox();
    // 'connected' now means "server can push" — queued context/results land.
    send({ type: 'rt-state', state: 'connected' });
    log('realtime data channel open');
  };
  rtDc.onmessage = (ev) => {
    let evt; try { evt = JSON.parse(ev.data); } catch (_) { return; }
    onRtEvent(evt);
  };
  // Mic selection: explicit ?mic= label substring wins; otherwise when a
  // Bluetooth earbud mic exists it hijacks the OS default input and its
  // 8kHz profile wrecks recognition — so we prefer the built-in mic while
  // audio output still routes to the earbuds.
  const rtAudioConstraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  try {
    const inputs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
    const find = (re) => inputs.find(d => re.test(d.label || ''));
    let target = null;
    if (MIC_PIN) target = inputs.find(d => (d.label || '').toLowerCase().includes(MIC_PIN.toLowerCase()));
    else if (find(/airpods|bluetooth|buds|headset|earphones/i)) target = find(/built.?in|macbook|internal|microphone array/i);
    if (target && target.deviceId) {
      rtAudioConstraints.deviceId = { exact: target.deviceId };
      log(`realtime mic pinned: ${target.label}`);
    }
  } catch (_) {}
  rtMic = await navigator.mediaDevices.getUserMedia({ audio: rtAudioConstraints });
  rtMic.getTracks().forEach(t => rtPc.addTrack(t, rtMic));
  rtPc.ontrack = (ev) => {
    rtAudioEl = document.createElement('audio');
    rtAudioEl.autoplay = true;
    rtAudioEl.srcObject = ev.streams[0];
    document.body.appendChild(rtAudioEl);
  };
  rtPc.onconnectionstatechange = () => {
    send({ type: 'rt-state', state: rtPc.connectionState });
    if (rtPc.connectionState === 'failed' || rtPc.connectionState === 'disconnected') setState('error');
  };

  const offer = await rtPc.createOffer();
  await rtPc.setLocalDescription(offer);
  // No trickle — the offer must carry gathered candidates, but don't burn a
  // fixed sleep: resolve the moment gathering completes (cap 1.5s).
  await waitForIceGathering(rtPc, 1500);

  const res = await fetch(`${location.origin}/voice.realtime.start`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sdp: rtPc.localDescription.sdp }),
  });
  const data = await res.json();
  if (!res.ok || !data.sdp) throw new Error(data.error || `HTTP ${res.status}`);
  await rtPc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
  // Remote is set; the call signals 'connected' once the data channel opens
  // (rtDc.onopen above) — not before, so server pushes can't die mid-handshake.
  speaking = false;
  suppressUntil = 0;
  setState('talking');
  log('realtime answer applied — waiting for data channel');
}

function stopRealtime(resume = true) {
  rtActive = false;
  try { rtDc && rtDc.close(); } catch (_) {}
  try { rtPc && rtPc.close(); } catch (_) {}
  try { rtMic && rtMic.getTracks().forEach(t => t.stop()); } catch (_) {}
  try { rtAudioEl && rtAudioEl.remove(); } catch (_) {}
  rtPc = rtDc = rtMic = rtAudioEl = null;
  rtAssistantBuf = '';
  rtOutbox = [];
  rtPendingCalls.clear();
  clearTimeout(rtDeferredCreate); rtDeferredCreate = null;
  rtUserSpeaking = false;
  if (resume && wantListening && !muted) { try { recognition && recognition.start(); } catch (_) {} }
}

// Barge-in truncates any response started while the user is talking — defer
// the response.create until speech stops (3s cap so a chatty user can't eat
// a tool result entirely).
let rtUserSpeaking = false;
let rtDeferredCreate = null;
function rtRequestResponse() {
  clearTimeout(rtDeferredCreate); rtDeferredCreate = null;
  if (rtUserSpeaking) {
    rtDeferredCreate = setTimeout(() => {
      rtDeferredCreate = null;
      rtSend({ type: 'response.create' });
    }, 3000);
    return;
  }
  rtSend({ type: 'response.create' });
}

// Function calls whose arguments stream is cut off mid-generation (user
// barge-in) never reach '.done' — they evaporate while the model believes
// it dispatched (observed: "Sit tight" + nothing running for minutes).
// Track in-flight calls so response.done/cancelled can report the drop.
const rtPendingCalls = new Set();

function rtToolResult(callId, output) {
  rtSend({
    type: 'conversation.item.create',
    item: { type: 'function_call_output', call_id: callId, output: String(output || 'Done.') },
  });
  rtRequestResponse();
}

// Server-pushed text (task results, proactive thoughts) → the model voices it
// in its own words at the next response.
function rtInject(text) {
  rtSend({
    type: 'conversation.item.create',
    item: { type: 'message', role: 'user', content: [{ type: 'input_text', text: String(text) }] },
  });
  rtRequestResponse();
}

// Live context refresh (frontmost app/tab changes) — context-only item, no
// response.create, so the model stays silent but sees fresh facts next turn.
function rtContextUpdate(text) {
  if (!text) return;
  rtSend({
    type: 'conversation.item.create',
    item: { type: 'message', role: 'user', content: [{ type: 'input_text', text: `[context update] ${String(text)}` }] },
  });
}

function onRtEvent(evt) {
  switch (evt.type) {
    case 'conversation.item.input_audio_transcription.completed':
      send({ type: 'rt-transcript', role: 'user', text: evt.transcript || '' });
      break;
    case 'response.output_audio_transcript.delta':
      rtAssistantBuf += evt.delta || '';
      break;
    case 'response.output_audio_transcript.done':
      send({ type: 'rt-transcript', role: 'assistant', text: evt.transcript || rtAssistantBuf });
      rtAssistantBuf = '';
      break;
    case 'response.function_call_arguments.delta':
      if (evt.call_id) rtPendingCalls.add(evt.call_id);
      break;
    case 'response.function_call_arguments.done':
      if (evt.call_id) rtPendingCalls.delete(evt.call_id);
      send({ type: 'rt-tool-call', call_id: evt.call_id, name: evt.name, arguments: evt.arguments });
      break;
    case 'input_audio_buffer.speech_started':
      rtUserSpeaking = true;
      send({ type: 'rt-state', state: 'user-speaking' });
      break;
    case 'input_audio_buffer.speech_stopped':
      rtUserSpeaking = false;
      if (rtDeferredCreate) {
        clearTimeout(rtDeferredCreate); rtDeferredCreate = null;
        rtSend({ type: 'response.create' });
      }
      break;
    case 'response.created':
      send({ type: 'rt-state', state: 'responding' });
      break;
    case 'response.cancelled':
    case 'response.done':
      if (rtPendingCalls.size) {
        // The user talked over the model mid-tool-call — the call evaporated
        // server-side while the model believes it dispatched. Tell the
        // bridge so it can prompt an immediate re-issue.
        send({ type: 'rt-tool-call-dropped', call_ids: [...rtPendingCalls] });
        rtPendingCalls.clear();
      }
      send({ type: 'rt-state', state: 'listening' });
      break;
    case 'error':
      send({ type: 'error', error: `realtime: ${evt.error?.message || 'unknown'}` });
      break;
    default:
      break;
  }
}

// ------------------------------------------------------------- level meter
async function startLevelMeter() {
  if (!LEVEL_METER || startLevelMeter.done) return;
  try {
    // Constraints also prep the stream for future KWS / barge-in taps.
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    const ctx = getCtx();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    startLevelMeter.done = true;
    setInterval(() => {
      if (!wantListening && !speaking) return;
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
      send({ type: 'level', level: Math.min(1, Math.sqrt(sum / data.length) * 3) });
    }, 100);
  } catch (e) {
    log(`level meter failed: ${e.message}`);
  }
}

// ------------------------------------------------- audio route detection
// Chrome SR follows the OS *default* input — when earbuds connect, macOS
// switches input to their 8kHz Bluetooth profile and recognition falls apart.
// We can't pin the SR mic, but we can detect + warn so the UI hints at it
// (realtime mode pins the built-in mic and is unaffected).
let _btRouteWarned = false;
async function checkAudioRoute() {
  try {
    const inputs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
    const bt = inputs.find(d => /airpods|bluetooth|buds|headset|earphones/i.test(d.label || ''));
    if (bt && !_btRouteWarned) {
      _btRouteWarned = true;
      send({ type: 'audio-route', device: bt.label || 'bluetooth-input' });
      log(`bluetooth mic present: ${bt.label} — pipeline STT may degrade`);
    } else if (!bt) {
      _btRouteWarned = false;
    }
  } catch (_) {}
}
try {
  if (navigator.mediaDevices?.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', checkAudioRoute);
  }
} catch (_) {}
checkAudioRoute();

// ------------------------------------------------- ambient audio capture
// getDisplayMedia system audio (macOS ≥14.2 + Chrome ≥141) → MediaRecorder →
// POST /voice.audio.chunk. Recording runs only while audio energy is present
// (VAD-segmented bursts) so each uploaded blob is a complete standalone webm —
// a MediaRecorder timeslice fragment has no init segment and won't decode.
// Bursts recorded while ThinkDrop itself is speaking are dropped — own TTS
// re-enters via system audio otherwise.
let ambStream = null, ambRecorder = null, ambSrc = null, ambAnalyser = null;
let ambVad = null, ambChunks = [], ambRecording = false, ambSilenceMs = 0;
let ambRecStart = 0, ambEnergy = 0;
const AMB_ENERGY_ON = 0.012;      // RMS threshold — below this counts as silence
const AMB_SILENCE_CLOSE = 1400;   // ms of silence ending a burst
const AMB_MAX_BURST = 30000;      // cap per uploaded blob
const AMB_MIN_BLOB = 800;         // bytes — drops clicks/door-thuds

async function ambientStart(engine) {
  if (ambRecorder) return;
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { displaySurface: 'monitor', width: 2, height: 2, frameRate: 1 },
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    selfBrowserSurface: 'exclude',
    surfaceSwitching: 'exclude',
    systemAudio: 'include',
    monitorTypeSurfaces: 'include',
  });
  stream.getVideoTracks().forEach(t => t.stop()); // audio-only need
  const audioTracks = stream.getAudioTracks();
  if (!audioTracks.length) { stream.getTracks().forEach(t => t.stop()); throw new Error('no system audio track'); }
  const audioStream = new MediaStream(audioTracks);
  audioTracks[0].onended = () => ambientStop(); // capture revoked via Chrome UI

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume().catch(() => {});
  ambSrc = audioCtx.createMediaStreamSource(audioStream);
  ambAnalyser = audioCtx.createAnalyser();
  ambAnalyser.fftSize = 512;
  ambSrc.connect(ambAnalyser);
  const buf = new Uint8Array(ambAnalyser.fftSize);

  ambRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });
  ambRecorder.ondataavailable = (e) => { if (e.data && e.data.size) ambChunks.push(e.data); };
  ambRecorder.onstop = () => {
    const blob = new Blob(ambChunks.splice(0), { type: 'audio/webm' });
    if (blob.size >= AMB_MIN_BLOB && !speaking) {
      fetch('/voice.audio.chunk', {
        method: 'POST',
        headers: { 'X-Ambient-Engine': engine || 'groq', 'X-Ambient-Energy': String(ambEnergy) },
        body: blob,
      }).catch(() => {});
    }
  };

  ambVad = setInterval(() => {
    ambAnalyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
    ambEnergy = Math.sqrt(sum / buf.length);
    const talking = ambEnergy > AMB_ENERGY_ON;
    const now = Date.now();
    if (talking && !ambRecording && !speaking) {
      ambChunks = []; ambRecStart = now; ambSilenceMs = 0;
      try { ambRecorder.start(); ambRecording = true; } catch (_) {}
    } else if (ambRecording) {
      ambSilenceMs = talking ? 0 : ambSilenceMs + 250;
      if (ambSilenceMs >= AMB_SILENCE_CLOSE || now - ambRecStart >= AMB_MAX_BURST || speaking) {
        try { ambRecorder.stop(); } catch (_) {}
        ambRecording = false;
      }
    }
  }, 250);
  ambStream = stream;
  log('ambient capture started');
}

function ambientStop() {
  if (ambVad) { clearInterval(ambVad); ambVad = null; }
  if (ambRecorder) { try { if (ambRecorder.state !== 'inactive') ambRecorder.stop(); } catch (_) {} ambRecorder = null; }
  if (ambSrc) { try { ambSrc.disconnect(); } catch (_) {} ambSrc = null; }
  ambAnalyser = null; ambRecording = false; ambChunks = [];
  if (ambStream) { ambStream.getTracks().forEach(t => t.stop()); ambStream = null; }
  log('ambient capture stopped');
}

connect();
log('worker loaded');
</script>
